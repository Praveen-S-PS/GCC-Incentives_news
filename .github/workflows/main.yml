name: Run GCC Incentives News Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run GCC news script
        run: |
          python app.py
